# QRATUM SBOM Generation and Validation Workflow
# 
# This workflow generates auditable, reproducible SBOMs for:
# - Python dependencies
# - Rust dependencies
# - Repository-level dependencies
# - Container images
#
# Standards: CycloneDX 1.6, SPDX 2.3
# Security: SLSA Level 2+ provenance

name: SBOM Generation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      generate_container_sbom:
        description: 'Generate container image SBOM'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # Pinned tool versions for reproducibility
  SYFT_VERSION: "1.18.1"
  COSIGN_VERSION: "2.4.1"
  CYCLONEDX_PY_VERSION: "4.6.0"
  CYCLONEDX_CLI_VERSION: "0.27.2"

jobs:
  # ===========================================================================
  # SBOM GENERATION JOB
  # ===========================================================================
  generate-sbom:
    name: Generate SBOMs
    runs-on: ubuntu-22.04
    outputs:
      sbom_artifact_id: ${{ steps.upload-sbom.outputs.artifact-id }}
      python_sbom_sha256: ${{ steps.hashes.outputs.python_sha256 }}
      rust_sbom_sha256: ${{ steps.hashes.outputs.rust_sha256 }}
      repo_sbom_sha256: ${{ steps.hashes.outputs.repo_sha256 }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for provenance

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Install SBOM tools
        run: |
          # Install syft (pinned version)
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | \
            sh -s -- -b /usr/local/bin v${SYFT_VERSION}
          
          # Install cyclonedx-py (pinned version)
          pip install cyclonedx-py==${CYCLONEDX_PY_VERSION}
          
          # Install cargo-cyclonedx
          cargo install cargo-cyclonedx --locked || true
          
          # Verify installations
          syft version
          cyclonedx-py --version || true

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]" || pip install numpy pyyaml click matplotlib

      - name: Create SBOM directory structure
        run: |
          mkdir -p .sbom/{cyclonedx,spdx,provenance,hashes,diffs}

      - name: Generate Python SBOM (CycloneDX)
        run: |
          # Primary: cyclonedx-py
          cyclonedx-py environment \
            --of json \
            --outfile .sbom/cyclonedx/python-cyclonedx-1.6.json \
            --schema-version 1.6 || {
            echo "cyclonedx-py failed, using syft fallback"
            syft dir:. \
              --source-name qratum-python \
              --output cyclonedx-json=.sbom/cyclonedx/python-cyclonedx-1.6.json \
              --catalogers python
          }

      - name: Generate Python SBOM (SPDX)
        run: |
          syft dir:. \
            --source-name qratum-python \
            --source-version ${{ github.sha }} \
            --output spdx-json=.sbom/spdx/python-spdx-2.3.json \
            --catalogers python

      - name: Generate Rust SBOM (CycloneDX)
        run: |
          # Generate for main rust crate
          if [[ -f qratum-rust/Cargo.toml ]]; then
            cd qratum-rust
            cargo cyclonedx \
              --format json \
              --spec-version 1.6 \
              --output-file ../.sbom/cyclonedx/rust-qratum-cyclonedx-1.6.json || {
              cd ..
              syft dir:. \
                --source-name qratum-rust \
                --output cyclonedx-json=.sbom/cyclonedx/rust-qratum-cyclonedx-1.6.json \
                --catalogers rust
            }
            cd ..
          fi

      - name: Generate Rust SBOM (SPDX)
        run: |
          syft dir:. \
            --source-name qratum-rust \
            --source-version ${{ github.sha }} \
            --output spdx-json=.sbom/spdx/rust-spdx-2.3.json \
            --catalogers rust

      - name: Generate Repository SBOM (CycloneDX)
        run: |
          syft dir:. \
            --source-name qratum \
            --source-version ${{ github.sha }} \
            --output cyclonedx-json=.sbom/cyclonedx/repo-cyclonedx-1.6.json

      - name: Generate Repository SBOM (SPDX)
        run: |
          syft dir:. \
            --source-name qratum \
            --source-version ${{ github.sha }} \
            --output spdx-json=.sbom/spdx/repo-spdx-2.3.json

      - name: Generate SBOM Hashes
        id: hashes
        run: |
          # Generate SHA256 checksums
          sha256sum .sbom/cyclonedx/*.json .sbom/spdx/*.json > .sbom/hashes/sbom-checksums.sha256
          
          # Generate SHA512 checksums
          sha512sum .sbom/cyclonedx/*.json .sbom/spdx/*.json > .sbom/hashes/sbom-checksums.sha512
          
          # Output individual hashes for outputs
          echo "python_sha256=$(sha256sum .sbom/cyclonedx/python-cyclonedx-1.6.json | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "rust_sha256=$(sha256sum .sbom/cyclonedx/rust-qratum-cyclonedx-1.6.json 2>/dev/null | awk '{print $1}' || echo 'n/a')" >> $GITHUB_OUTPUT
          echo "repo_sha256=$(sha256sum .sbom/cyclonedx/repo-cyclonedx-1.6.json | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Generate Build Provenance
        run: |
          python3 << 'EOF'
          import json
          import os
          import subprocess
          import glob
          import hashlib
          from datetime import datetime, timezone
          
          def run_cmd(cmd):
              try:
                  result = subprocess.run(cmd, capture_output=True, text=True, check=True, shell=True)
                  return result.stdout.strip()
              except:
                  return 'unknown'
          
          provenance = {
              "_type": "https://in-toto.io/Statement/v1",
              "subject": [],
              "predicateType": "https://slsa.dev/provenance/v1",
              "predicate": {
                  "buildDefinition": {
                      "buildType": "https://github.com/qratum/build/v1",
                      "externalParameters": {
                          "repository": os.getenv("GITHUB_REPOSITORY", "local"),
                          "ref": os.getenv("GITHUB_REF", "unknown"),
                          "sha": os.getenv("GITHUB_SHA", "unknown"),
                          "workflow": os.getenv("GITHUB_WORKFLOW", "unknown")
                      },
                      "internalParameters": {
                          "runner": os.getenv("RUNNER_NAME", "unknown"),
                          "os": os.getenv("RUNNER_OS", "unknown"),
                          "pythonVersion": run_cmd("python3 --version"),
                          "rustVersion": run_cmd("rustc --version")
                      }
                  },
                  "runDetails": {
                      "builder": {
                          "id": f"https://github.com/{os.getenv('GITHUB_REPOSITORY', 'unknown')}/actions/runs/{os.getenv('GITHUB_RUN_ID', '0')}"
                      },
                      "metadata": {
                          "invocationId": os.getenv("GITHUB_RUN_ID", "unknown"),
                          "startedOn": datetime.now(timezone.utc).isoformat()
                      }
                  }
              }
          }
          
          # Add subjects (all SBOM files)
          for sbom_path in glob.glob(".sbom/cyclonedx/*.json") + glob.glob(".sbom/spdx/*.json"):
              with open(sbom_path, 'rb') as f:
                  content = f.read()
                  sha256 = hashlib.sha256(content).hexdigest()
              provenance["subject"].append({
                  "name": os.path.basename(sbom_path),
                  "digest": {"sha256": sha256}
              })
          
          with open(".sbom/provenance/build-provenance.json", 'w') as f:
              json.dump(provenance, f, indent=2)
          
          print("Build provenance generated successfully")
          EOF

      - name: Generate Artifact Binding
        run: |
          python3 << 'EOF'
          import json
          import os
          import glob
          import hashlib
          from datetime import datetime, timezone
          
          binding = {
              "version": "1.0.0",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "gitSha": os.getenv("GITHUB_SHA", "unknown"),
              "gitRef": os.getenv("GITHUB_REF", "unknown"),
              "runId": os.getenv("GITHUB_RUN_ID", "unknown"),
              "bindings": []
          }
          
          targets = {
              "python": ["pyproject.toml", "requirements.txt"],
              "rust": ["qratum-rust/Cargo.toml"],
              "repo": ["."]
          }
          
          for sbom_path in glob.glob(".sbom/cyclonedx/*.json"):
              with open(sbom_path, 'rb') as f:
                  sha256 = hashlib.sha256(f.read()).hexdigest()
              
              basename = os.path.basename(sbom_path)
              for target_type, sources in targets.items():
                  if target_type in basename:
                      binding["bindings"].append({
                          "sbom": basename,
                          "sbomSha256": sha256,
                          "targetType": target_type,
                          "sources": sources
                      })
                      break
          
          with open(".sbom/provenance/artifact-binding.json", 'w') as f:
              json.dump(binding, f, indent=2)
          
          print("Artifact binding generated successfully")
          EOF

      - name: Upload SBOM artifacts
        id: upload-sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: .sbom/
          retention-days: 90
          if-no-files-found: error

  # ===========================================================================
  # SBOM VALIDATION JOB
  # ===========================================================================
  validate-sbom:
    name: Validate SBOMs
    runs-on: ubuntu-22.04
    needs: generate-sbom
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: .sbom/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate SBOM structure
        run: |
          echo "Validating SBOM directory structure..."
          
          required_dirs=("cyclonedx" "spdx" "provenance" "hashes")
          for dir in "${required_dirs[@]}"; do
            if [[ ! -d ".sbom/${dir}" ]]; then
              echo "ERROR: Missing required directory: ${dir}"
              exit 1
            fi
          done
          
          sbom_count=$(find .sbom -name "*.json" -type f | wc -l)
          if [[ $sbom_count -eq 0 ]]; then
            echo "ERROR: No SBOM files found"
            exit 1
          fi
          
          echo "Structure validation passed. Found ${sbom_count} SBOM files."

      - name: Validate CycloneDX SBOMs
        run: |
          echo "Validating CycloneDX SBOMs..."
          failed=0
          
          for sbom in .sbom/cyclonedx/*.json; do
            [[ -f "$sbom" ]] || continue
            echo "  Checking: $(basename "$sbom")"
            
            python3 << EOF || failed=1
          import json
          import sys
          
          with open('${sbom}') as f:
              data = json.load(f)
          
          errors = []
          
          if data.get('bomFormat') != 'CycloneDX':
              errors.append('bomFormat must be CycloneDX')
          
          spec = data.get('specVersion', '')
          if not spec.startswith('1.'):
              errors.append(f'Invalid specVersion: {spec}')
          
          if 'metadata' not in data:
              errors.append('Missing metadata section')
          
          if errors:
              for e in errors:
                  print(f'  ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          
          print(f'  Valid CycloneDX {spec} with {len(data.get("components", []))} components')
          EOF
          done
          
          if [[ $failed -eq 1 ]]; then
            echo "CycloneDX validation FAILED"
            exit 1
          fi

      - name: Validate SPDX SBOMs
        run: |
          echo "Validating SPDX SBOMs..."
          failed=0
          
          for sbom in .sbom/spdx/*.json; do
            [[ -f "$sbom" ]] || continue
            echo "  Checking: $(basename "$sbom")"
            
            python3 << EOF || failed=1
          import json
          import sys
          
          with open('${sbom}') as f:
              data = json.load(f)
          
          errors = []
          
          version = data.get('spdxVersion', '')
          if not version.startswith('SPDX-'):
              errors.append(f'Invalid spdxVersion: {version}')
          
          if 'SPDXID' not in data:
              errors.append('Missing SPDXID')
          
          if 'name' not in data:
              errors.append('Missing name')
          
          if errors:
              for e in errors:
                  print(f'  ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          
          print(f'  Valid {version} with {len(data.get("packages", []))} packages')
          EOF
          done
          
          if [[ $failed -eq 1 ]]; then
            echo "SPDX validation FAILED"
            exit 1
          fi

      - name: Validate Hash Integrity
        run: |
          echo "Validating SBOM hash integrity..."
          
          cd .sbom
          if sha256sum -c hashes/sbom-checksums.sha256; then
            echo "Hash validation PASSED"
          else
            echo "Hash validation FAILED"
            exit 1
          fi

      - name: Validate Provenance
        run: |
          echo "Validating build provenance..."
          
          python3 << 'EOF'
          import json
          import sys
          
          with open('.sbom/provenance/build-provenance.json') as f:
              data = json.load(f)
          
          errors = []
          
          if data.get('_type') != 'https://in-toto.io/Statement/v1':
              errors.append('Invalid _type')
          
          if 'subject' not in data or not data['subject']:
              errors.append('Missing or empty subject list')
          
          if 'predicate' not in data:
              errors.append('Missing predicate')
          
          if errors:
              for e in errors:
                  print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          
          print(f'Valid provenance with {len(data.get("subject", []))} subjects')
          EOF

      - name: Policy Gate - Dependency Count
        run: |
          echo "Checking dependency count policy..."
          MAX_DEPS=1000
          
          total_deps=0
          for sbom in .sbom/cyclonedx/*.json; do
            [[ -f "$sbom" ]] || continue
            
            count=$(python3 << EOF
          import json
          with open('${sbom}') as f:
              data = json.load(f)
          print(len(data.get('components', [])))
          EOF
            )
            total_deps=$((total_deps + count))
          done
          
          echo "Total dependencies: ${total_deps}"
          
          if [[ $total_deps -gt $MAX_DEPS ]]; then
            echo "ERROR: Dependency explosion detected: ${total_deps} > ${MAX_DEPS}"
            exit 1
          fi
          
          echo "Dependency count check PASSED"

  # ===========================================================================
  # SBOM DIFF JOB (only on PRs)
  # ===========================================================================
  diff-sbom:
    name: Diff SBOMs
    runs-on: ubuntu-22.04
    needs: validate-sbom
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: .sbom-current/

      - name: Download baseline SBOM from main
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: sbom.yml
          branch: main
          name: sbom-*
          path: .sbom-baseline/
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare SBOMs
        run: |
          if [[ ! -d ".sbom-baseline" ]] || [[ -z "$(ls -A .sbom-baseline 2>/dev/null)" ]]; then
            echo "No baseline SBOM found. First build - skipping diff."
            exit 0
          fi
          
          mkdir -p .sbom-current/diffs
          
          for current in .sbom-current/cyclonedx/*.json; do
            [[ -f "$current" ]] || continue
            
            basename=$(basename "$current")
            baseline=".sbom-baseline/cyclonedx/${basename}"
            
            if [[ ! -f "$baseline" ]]; then
              echo "No baseline for ${basename} (new SBOM)"
              continue
            fi
            
            echo "Comparing: ${basename}"
            
            python3 << EOF
          import json
          
          with open('${current}') as f:
              current_data = json.load(f)
          with open('${baseline}') as f:
              baseline_data = json.load(f)
          
          current_deps = {f"{c['name']}@{c['version']}" for c in current_data.get('components', [])}
          baseline_deps = {f"{c['name']}@{c['version']}" for c in baseline_data.get('components', [])}
          
          added = current_deps - baseline_deps
          removed = baseline_deps - current_deps
          
          print(f"  Added: {len(added)}, Removed: {len(removed)}")
          
          if added:
              print("  New dependencies:")
              for dep in sorted(added):
                  print(f"    + {dep}")
          
          if removed:
              print("  Removed dependencies:")
              for dep in sorted(removed):
                  print(f"    - {dep}")
          
          # Policy: Fail if more than 10 new deps added
          MAX_NEW_DEPS = 10
          if len(added) > MAX_NEW_DEPS:
              print(f"ERROR: Too many new dependencies: {len(added)} > {MAX_NEW_DEPS}")
              exit(1)
          EOF
          done
          
          echo "SBOM diff check PASSED"

  # ===========================================================================
  # RELEASE ATTACHMENT JOB
  # ===========================================================================
  attach-to-release:
    name: Attach SBOMs to Release
    runs-on: ubuntu-22.04
    needs: [generate-sbom, validate-sbom]
    if: github.event_name == 'release'
    
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: .sbom/

      - name: Create SBOM archive
        run: |
          tar -czvf sbom-${{ github.event.release.tag_name }}.tar.gz .sbom/
          sha256sum sbom-${{ github.event.release.tag_name }}.tar.gz > sbom-${{ github.event.release.tag_name }}.tar.gz.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-${{ github.event.release.tag_name }}.tar.gz
            sbom-${{ github.event.release.tag_name }}.tar.gz.sha256
            .sbom/cyclonedx/repo-cyclonedx-1.6.json
            .sbom/spdx/repo-spdx-2.3.json
            .sbom/provenance/build-provenance.json

  # ===========================================================================
  # CONTAINER SBOM JOB (optional)
  # ===========================================================================
  container-sbom:
    name: Container Image SBOM
    runs-on: ubuntu-22.04
    needs: generate-sbom
    if: github.event.inputs.generate_container_sbom == 'true' || github.event_name == 'release'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: |
          docker build -t qratum:${{ github.sha }} -f Dockerfile.production .

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | \
            sh -s -- -b /usr/local/bin v${SYFT_VERSION}

      - name: Generate container SBOM
        run: |
          mkdir -p .sbom-container/cyclonedx .sbom-container/spdx
          
          syft qratum:${{ github.sha }} \
            --output cyclonedx-json=.sbom-container/cyclonedx/container-cyclonedx-1.6.json \
            --output spdx-json=.sbom-container/spdx/container-spdx-2.3.json

      - name: Upload container SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-container-${{ github.sha }}
          path: .sbom-container/
          retention-days: 90
