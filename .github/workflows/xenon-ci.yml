name: XENON CI

# Gates the xenon subsystem: its full (currently green) test corpus plus a
# syntax check, on the supported Python matrix. Intended to be branch-protection
# required so the API-drift failures fixed during hardening cannot return.

on:
  push:
    paths:
      - "xenon/**"
      - "qratum/bioinformatics/**"
      - "tests/hardening/xenon_v5/**"
      - ".github/workflows/xenon-ci.yml"
  pull_request:
    paths:
      - "xenon/**"
      - "qratum/bioinformatics/**"
      - "tests/hardening/xenon_v5/**"
      - ".github/workflows/xenon-ci.yml"

jobs:
  test-xenon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r xenon/requirements.txt
          pip install pytest pytest-timeout

      - name: Syntax gate (xenon must always compile)
        run: |
          python -m compileall -q xenon

      - name: Run xenon test corpus
        run: |
          pytest \
            xenon/tests \
            xenon/bioinformatics/tests \
            xenon/molecular_dynamics_lab/tests \
            tests/hardening/xenon_v5 \
            --import-mode=importlib -p no:cacheprovider \
            -o addopts="" --timeout=120 -q
