[workspace]
resolver = "2"
members = [
    "crates/emu-core",
    "crates/emu-cpu",
    "crates/emu-memory",
    "crates/emu-android-runtime",
    "crates/emu-graphics",
    "crates/emu-audio",
    "crates/emu-input",
    "crates/emu-filesystem",
    "crates/emu-pc-compat",
    "crates/emu-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/robertringler/QRATUM"
authors = ["QRATUM Platform <info@qratum.ai>"]
keywords = ["emulator", "android", "arm64", "x86-64", "research"]
categories = ["emulators", "development-tools"]

[workspace.dependencies]
# Core dependencies
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
bitflags = "2.4"
byteorder = "1.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Memory mapping and low-level
memmap2 = "0.9"
libc = "0.2"
nix = { version = "0.28", features = ["fs", "mman", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Graphics (optional, feature-gated)
ash = "0.38"
gpu-allocator = "0.26"

# Testing
proptest = "1.4"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
opt-level = 3
debug = true
