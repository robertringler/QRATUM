<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#37474f"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b71c1c"/>
    </marker>
  </defs>

  <rect width="1080" height="760" fill="#fafafa"/>
  <text x="540" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#212121">Physical Operator Computer — Node Architecture</text>
  <text x="540" y="56" text-anchor="middle" font-size="13" fill="#616161">Intent → Authority → Contract → Time → Execution → Event → Audit (QRATUM canonical flow)</text>

  <!-- Plane 1: Intent / Compile -->
  <rect x="40" y="80" width="1000" height="92" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="56" y="102" font-size="14" font-weight="bold" fill="#0d47a1">1 · INTENT / COMPILE PLANE (digital host)</text>
  <rect x="60" y="112" width="180" height="46" rx="5" fill="#fff" stroke="#1565c0"/>
  <text x="150" y="131" text-anchor="middle" font-size="12" font-weight="bold">QIL Intent</text>
  <text x="150" y="147" text-anchor="middle" font-size="10" fill="#555">HARDWARE POC · precision · deadline</text>
  <rect x="280" y="112" width="180" height="46" rx="5" fill="#fff" stroke="#1565c0"/>
  <text x="370" y="131" text-anchor="middle" font-size="12" font-weight="bold">Q-Core Authority</text>
  <text x="370" y="147" text-anchor="middle" font-size="10" fill="#555">authorize · resolve capability</text>
  <rect x="500" y="112" width="200" height="46" rx="5" fill="#fff" stroke="#1565c0"/>
  <text x="600" y="131" text-anchor="middle" font-size="12" font-weight="bold">OperatorContract</text>
  <text x="600" y="147" text-anchor="middle" font-size="10" fill="#555">hash-addressed · norm bound · shot budget</text>
  <rect x="740" y="112" width="280" height="46" rx="5" fill="#fff" stroke="#1565c0"/>
  <text x="880" y="131" text-anchor="middle" font-size="12" font-weight="bold">poc-compile</text>
  <text x="880" y="147" text-anchor="middle" font-size="10" fill="#555">SVD factorize → fuse/schedule → budget shots</text>
  <line x1="240" y1="135" x2="280" y2="135" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="135" x2="500" y2="135" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="135" x2="740" y2="135" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Plane 2: Control -->
  <rect x="40" y="192" width="1000" height="86" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="56" y="214" font-size="14" font-weight="bold" fill="#e65100">2 · CONTROL PLANE (FPGA)</text>
  <rect x="60" y="224" width="230" height="44" rx="5" fill="#fff" stroke="#ef6c00"/>
  <text x="175" y="242" text-anchor="middle" font-size="12" font-weight="bold">Mesh Configuration Program</text>
  <text x="175" y="258" text-anchor="middle" font-size="10" fill="#555">DAC sequences · thermal deadtimes</text>
  <rect x="320" y="224" width="220" height="44" rx="5" fill="#fff" stroke="#ef6c00"/>
  <text x="430" y="242" text-anchor="middle" font-size="12" font-weight="bold">Hardware Clamps</text>
  <text x="430" y="258" text-anchor="middle" font-size="10" fill="#555">gain ≤ norm_bound · power · duration</text>
  <rect x="570" y="224" width="220" height="44" rx="5" fill="#fff" stroke="#ef6c00"/>
  <text x="680" y="242" text-anchor="middle" font-size="12" font-weight="bold">Calibration Epoch Gate</text>
  <text x="680" y="258" text-anchor="middle" font-size="10" fill="#555">epoch hash must match contract</text>
  <rect x="820" y="224" width="200" height="44" rx="5" fill="#fff" stroke="#ef6c00"/>
  <text x="920" y="242" text-anchor="middle" font-size="12" font-weight="bold">Staged Operator Memory</text>
  <text x="920" y="258" text-anchor="middle" font-size="10" fill="#555">config vectors, hash-addressed</text>
  <line x1="600" y1="158" x2="600" y2="192" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Plane 3: Execution (photonic) -->
  <rect x="40" y="298" width="1000" height="200" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="56" y="320" font-size="14" font-weight="bold" fill="#1b5e20">3 · EXECUTION PLANE (photonic)</text>

  <!-- OAU A and B -->
  <rect x="60" y="334" width="300" height="70" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="210" y="354" text-anchor="middle" font-size="12" font-weight="bold">OAU-A  (active)</text>
  <text x="210" y="371" text-anchor="middle" font-size="10" fill="#555">V† mesh → Σ attenuators → U mesh</text>
  <text x="210" y="386" text-anchor="middle" font-size="10" fill="#555">n=64 · 2,016 MZIs · 2 ns transit</text>
  <rect x="60" y="416" width="300" height="64" rx="5" fill="#f1f8e9" stroke="#2e7d32" stroke-dasharray="5,3"/>
  <text x="210" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#558b2f">OAU-B  (reconfiguring / calibrating)</text>
  <text x="210" y="456" text-anchor="middle" font-size="10" fill="#777">double-buffered: 10 µs thermal settle hidden</text>

  <!-- Spectral Unit -->
  <rect x="400" y="334" width="290" height="146" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="545" y="354" text-anchor="middle" font-size="12" font-weight="bold">Spectral Unit — 4 loop registers</text>
  <text x="545" y="374" text-anchor="middle" font-size="10" fill="#555">Power mode:  Aᵏψ  (k transits)</text>
  <text x="545" y="392" text-anchor="middle" font-size="10" fill="#555">Resolvent:  (I − αA)⁻¹ψ  (ringdown)</text>
  <text x="545" y="410" text-anchor="middle" font-size="10" fill="#555">Ringdown spectroscopy → spec(A)</text>
  <text x="545" y="428" text-anchor="middle" font-size="10" fill="#555">Chebyshev recurrence → f(A)ψ</text>
  <circle cx="545" cy="455" r="14" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <path d="M 559 455 a 14 14 0 1 1 -4 -10" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Evolution Unit -->
  <rect x="730" y="334" width="290" height="146" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="875" y="354" text-anchor="middle" font-size="12" font-weight="bold">Evolution Unit</text>
  <text x="875" y="374" text-anchor="middle" font-size="10" fill="#555">EVO(H, L, t):  e^{tℒ} via split steps</text>
  <text x="875" y="392" text-anchor="middle" font-size="10" fill="#555">phase pattern (H) + engineered loss (L)</text>
  <text x="875" y="410" text-anchor="middle" font-size="10" fill="#555">steady states · relaxation · sampling</text>
  <text x="875" y="442" text-anchor="middle" font-size="10" fill="#1b5e20" font-style="italic">state memory = the field itself</text>
  <text x="875" y="458" text-anchor="middle" font-size="10" fill="#1b5e20" font-style="italic">lifetime ≈ loop photon lifetime (µs)</text>

  <line x1="360" y1="369" x2="400" y2="383" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="407" x2="730" y2="407" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="278" x2="430" y2="298" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Plane 4: Measurement -->
  <rect x="40" y="518" width="1000" height="86" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="56" y="540" font-size="14" font-weight="bold" fill="#4a148c">4 · MEASUREMENT PLANE</text>
  <rect x="60" y="550" width="260" height="44" rx="5" fill="#fff" stroke="#6a1b9a"/>
  <text x="190" y="568" text-anchor="middle" font-size="12" font-weight="bold">64 × Homodyne Detectors</text>
  <text x="190" y="584" text-anchor="middle" font-size="10" fill="#555">amplitude + phase · 5 GS/s ADC</text>
  <rect x="350" y="550" width="240" height="44" rx="5" fill="#fff" stroke="#6a1b9a"/>
  <text x="470" y="568" text-anchor="middle" font-size="12" font-weight="bold">Shot Accumulation</text>
  <text x="470" y="584" text-anchor="middle" font-size="10" fill="#555">precision = f(photon budget, shots)</text>
  <rect x="620" y="550" width="400" height="44" rx="5" fill="#fff" stroke="#6a1b9a"/>
  <text x="820" y="568" text-anchor="middle" font-size="12" font-weight="bold">Digital Cleanup Loop (hybrid iteration)</text>
  <text x="820" y="584" text-anchor="middle" font-size="10" fill="#555">fp64 residual on host → re-inject · +7 bits per round</text>
  <line x1="210" y1="498" x2="190" y2="518" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="498" x2="470" y2="550" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="875" y1="498" x2="820" y2="550" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Plane 5: Audit -->
  <rect x="40" y="624" width="1000" height="86" rx="8" fill="#eceff1" stroke="#37474f" stroke-width="1.5"/>
  <text x="56" y="646" font-size="14" font-weight="bold" fill="#263238">5 · AUDIT PLANE</text>
  <rect x="60" y="656" width="280" height="44" rx="5" fill="#fff" stroke="#37474f"/>
  <text x="200" y="674" text-anchor="middle" font-size="12" font-weight="bold">QRATUM Event Log</text>
  <text x="200" y="690" text-anchor="middle" font-size="10" fill="#555">hash-chained · append-only · statistical replay</text>
  <rect x="370" y="656" width="300" height="44" rx="5" fill="#fff" stroke="#37474f"/>
  <text x="520" y="674" text-anchor="middle" font-size="12" font-weight="bold">Verifier  L1 / L2 / L3</text>
  <text x="520" y="690" text-anchor="middle" font-size="10" fill="#555">config hash · sparse tomography · digital-twin audit</text>
  <rect x="700" y="656" width="320" height="44" rx="5" fill="#fff" stroke="#37474f"/>
  <text x="860" y="674" text-anchor="middle" font-size="12" font-weight="bold">Drift Sentinels</text>
  <text x="860" y="690" text-anchor="middle" font-size="10" fill="#555">canary word · contraction-rate monitor · detector tracking</text>
  <line x1="190" y1="604" x2="200" y2="656" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sentinel invalidation feedback (red, right side) -->
  <path d="M 1020 678 C 1064 678 1064 246 1020 246" fill="none" stroke="#b71c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="1062" y="460" font-size="10" fill="#b71c1c" transform="rotate(90 1062 460)">sentinel 2σ excursion → invalidate calibration epoch → halt contracts</text>

  <!-- Cleanup feedback (left side, measurement back to execution) -->
  <path d="M 620 597 C 30 597 18 386 60 372" fill="none" stroke="#6a1b9a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="86" y="516" font-size="10" fill="#6a1b9a">residual re-injection</text>

  <text x="540" y="738" text-anchor="middle" font-size="11" fill="#757575">QRATUM Research Series · POC-MONO-1.0 · see docs/PHYSICAL_OPERATOR_COMPUTER.md</text>
</svg>
