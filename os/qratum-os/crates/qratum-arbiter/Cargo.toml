[package]
name        = "qratum-arbiter"
version     = "0.0.1"
edition     = "2021"
description = "Host-side formal model of the QRATUM kernel intent arbiter — replay & golden corpus harness."
license     = "Proprietary"
publish     = false

[lib]
path = "src/lib.rs"

[dependencies]
serde      = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
blake3     = "=1.5.4"

[dev-dependencies]

