# Lattice Field Model parameter grid (locked)
model_type: lattice

parameters:
  n_sites: [32, 64]
  cutoff_scale: [10, 100, 1000]  # log-spaced
  dispersion_strength: [0.0, 0.5, 1.0, 2.0]
  flow_velocity_ratio: [0.5, 0.7, 0.9, 0.95, 1.0]
  dissipation_rate: [0.001, 0.01]

# Fixed parameters
fixed:
  n_timesteps: 100
  dt: 0.01
  boundary_conditions: "periodic"
  lattice_spacing: 1.0
